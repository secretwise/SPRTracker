# spr tracker
# алерты для модеров + дискорд
# цвета: &#RRGGBB или обычные &7 &f
# релоуд: /tracker reload

general:
  # не показывать модеру его же алерты (вебхук всё равно уйдёт)
  ignore-self: false
  # миры, где трекер молчит
  disabled-worlds: []
  # дублировать в консоль
  console: true
  # сколько последних алертов держать для /tracker history
  history-size: 50
  time-format: "HH:mm:ss"

display:
  chat: true
  actionbar: false
  # координаты в сообщении кликабельные, копируются в буфер
  copy-coords: true
  coords-format: "%world% %x% %y% %z%"
  # что попадёт в буфер при клике
  coords-copy-format: "%world% %x% %y% %z%"
  coords-hover: "&7нажми, чтобы скопировать"
  sound:
    enabled: true
    name: "ui.button.click"
    volume: 0.8
    pitch: 1.4
  title:
    enabled: false
    title: "&#F34242▶ &f%type% &#F34242◀"
    subtitle: "&f%player%"
    fade-in: 0
    stay: 20
    fade-out: 10

alerts:
  totem:
    enabled: true
    # сек между алертами по одному игроку, 0 = без кулдауна
    cooldown-seconds: 0
    message: "&#F34242▶ &f%player% &7попнул тотем &8(&f%totems%&8, &7от &f%damager%&8, &f%weapon%&8, &7%cause%&8) &7%coords%"
    webhook: true
  crystal:
    enabled: true
    cooldown-seconds: 0
    message: "&#F34242▶ &f%player% &7взорвал кристалл &8(&f%victims%&8: &f%victim_list%&8) &7%coords%"
    webhook: true
    # только кристаллы, поставленные игроком
    only-player-placed: true
    # радиус поиска задетых
    radius: 6.0
  kill:
    enabled: true
    cooldown-seconds: 0
    message: "&#F34242▶ &f%killer% &7убил &f%player% &8(&f%weapon%&8, &7%cause%&8, &f%distance%&7м&8, &7хп &f%killer_health%&8) &7%coords%"
    webhook: true

combat:
  # сколько секунд после удара смерть ещё считается его киллом
  window-seconds: 15
  # огонь, лава, падение, ветер и прочее окружение засчитывать тому, кто ударил
  attribute-environmental: true
  # какие причины смерти так засчитываются
  environmental-causes:
    - fall
    - in_fire
    - on_fire
    - fire_tick
    - lava
    - hot_floor
    - campfire
    - explosion
    - player_explosion
    - wind_charge
    - fly_into_wall
    - drown
    - out_of_world
    - cactus
    - sweet_berry_bush
    - freeze
    - lightning_bolt
    - falling_block
    - falling_anvil
    - falling_stalactite

webhook:
  enabled: false
  url: ""
  username: "spr tracker"
  avatar-url: ""
  server-name: "spr"
  footer: "sprtracker · %server%"
  # пауза между сообщениями, discord не любит спам
  interval-ms: 1200
  timeout-ms: 5000
  embed:
    totem:
      title: "тотем"
      color: "#F34242"
      description: "`%player%` попнул тотем. осталось %totems%, за жизнь %pops%. от %damager%. %world% %x% %y% %z%."
    crystal:
      title: "кристалл"
      color: "#9B59B6"
      description: "`%player%` взорвал кристалл в %world% %x% %y% %z%. зацепило %victims%."
    kill:
      title: "килл"
      color: "#C0392B"
      description: "`%killer%` убил `%player%`. %weapon%, %cause%, %distance% бл. хп у киллера %killer_health%. ассисты: %assists%. %world% %x% %y% %z%."

