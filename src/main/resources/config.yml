  prefix: "&#F34242▶ &f"
  no-perm: "&cнет прав."
  player-only: "&cтолько для игрока."
  unknown-command: "&cнет такой команды. &7/tracker help"
  unknown-type: "&cнет такого типа. &7totem, crystal, kill"
  unknown-player: "кто-то"
  causes:
    player_attack: "удар"
